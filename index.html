<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pole Racer — La Formule 1 en low poly</title>
<meta name="description" content="Pole Racer, un jeu de course de Formule 1 en low poly inspiré des jeux 16 bits, par Indiana Games.">
<meta name="theme-color" content="#181c25">
<meta property="og:title" content="Pole Racer">
<meta property="og:description" content="La Formule 1 en low poly, inspirée des jeux 16 bits.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pole-racer.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Cairo:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#jeu" data-i18n="skip">Aller au contenu</a>

<header class="nav" id="nav">
  <a class="logo" href="#top">Pole Racer</a>
  <nav class="menu">
    <a href="#jeu" data-i18n="nav_game">Le jeu</a>
    <a href="#actus" data-i18n="nav_news">Actus</a>
    <a href="#medias" data-i18n="nav_media">Médias</a>
  </nav>
  <div class="nav-right">
    <select id="lang" class="lang"></select>
    <a id="navBuy" class="btn btn-sm btn-primary" href="#suivre"></a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-bg" aria-hidden="true"><img id="heroImg" alt="" hidden></div>
    <div class="hero-inner">
      <div class="hero-copy">
        <p class="status"><span class="dot"></span><span id="badge"></span></p>
        <h1 id="title" aria-label="Pole Racer"><span class="w">Pole</span><span class="w">Racer</span></h1>
        <p class="tagline" id="tagline"></p>
        <div class="cta-row">
          <a id="buyBtn" class="btn btn-primary" href="#suivre"></a>
          <a id="demoBtn" class="btn btn-light" href="#suivre" hidden></a>
          <a id="trailerBtn" class="btn btn-ghost" href="#medias" data-i18n="watch_trailer" hidden>Voir le trailer</a>
        </div>
      </div>
      <aside class="tower">
        <h2 data-i18n="tower_title">Fiche du jeu</h2>
        <ul id="facts"></ul>
      </aside>
    </div>
  </section>
  <div class="kerb" aria-hidden="true"></div>

  <section id="jeu" class="sec">
    <div class="wrap split">
      <div>
        <h2 class="h2" data-i18n="h_game">Le jeu</h2>
        <div id="about" class="lead"></div>
      </div>
      <ul id="features" class="features"></ul>
    </div>
    <div id="showcaseWrap" class="wrap showcase-wrap" hidden>
      <ul id="showcase" class="showcase"></ul>
    </div>
    <div id="detailsWrap" class="wrap details-wrap" hidden>
      <h3 class="h3" data-i18n="h_details">Le jeu en détail</h3>
      <ul id="details" class="details"></ul>
    </div>
  </section>

  <section id="actus" class="sec sec-alt">
    <div class="wrap">
      <h2 class="h2" data-i18n="h_news">Actus</h2>
      <div id="news" class="news"></div>
    </div>
  </section>

  <section id="medias" class="sec">
    <div class="wrap">
      <h2 class="h2" data-i18n="h_media">Médias</h2>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabPhotos" aria-selected="true" aria-controls="panePhotos" data-i18n="tab_photos">Photos</button>
        <button type="button" role="tab" id="tabVideos" aria-selected="false" aria-controls="paneVideos" data-i18n="tab_videos">Vidéos</button>
      </div>
      <div id="panePhotos" role="tabpanel" aria-labelledby="tabPhotos">
        <div id="gallery" class="gallery"></div>
      </div>
      <div id="paneVideos" role="tabpanel" aria-labelledby="tabVideos" hidden>
        <div id="videomain" class="video-main"></div>
        <div id="videolist" class="videos"></div>
        <p id="videoEmpty" class="empty" data-i18n="no_videos">La bande-annonce arrive bientôt.</p>
      </div>
    </div>
  </section>

  <section id="suivre" class="cta">
    <div class="wrap cta-inner">
      <h2 id="ctaTitle" class="cta-title"></h2>
      <p id="ctaText" class="cta-text"></p>
      <div class="cta-actions">
        <a id="ctaBuy" class="btn btn-white" href="#" hidden></a>
        <a id="ctaDemo" class="btn btn-outline" href="#" hidden></a>
      </div>
      <div id="links" class="links"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <p>© <span id="year"></span> Pole Racer — <span data-i18n="made_by">un jeu</span> <a href="https://indianagames.pages.dev">Indiana Games</a></p>
</footer>

<script src="app.js"></script>
</body>
</html>
