backend:
  name: github
  repo: capitaincompote-blip/pole-racer
  branch: main

locale: fr
site_url: https://pole-racer.com
media_folder: images/uploads
public_folder: /images/uploads

# Langues du site = langues du jeu. Le français est la langue de référence :
# si un champ est vide dans une langue, le site affiche la version française.
i18n:
  structure: single_file
  locales: [fr, en, de, es, ar, it]
  default_locale: fr

collections:
  - name: site
    label: Site Pole Racer
    files:
      - name: contenu
        label: Contenu du site
        file: content/site.json
        format: json
        i18n: true
        fields:
          - { name: hero_title, label: Titre principal, widget: string, i18n: duplicate }
          - { name: hero_tagline, label: Phrase d'accroche, widget: string, i18n: true }
          - { name: status_badge, label: "Pastille d'état (ex. En développement, vide = masquée)", widget: string, required: false, i18n: true }
          - { name: hero_image, label: "Image principale de l'accueil (capture ou illustration, format paysage, facultatif)", widget: image, required: false, i18n: duplicate }
          - { name: buy_url, label: "Lien pour acheter le jeu (https://…). Laisser vide tant que le jeu n'est pas en vente.", widget: string, required: false, i18n: duplicate }
          - { name: demo_url, label: "Lien de la démo gratuite (https://…). Laisser vide s'il n'y en a pas.", widget: string, required: false, i18n: duplicate }
          - name: facts
            label: "Fiche du jeu (genre, plateformes, date de sortie, prix…)"
            label_singular: information
            widget: list
            i18n: true
            summary: "{{fields.label}} : {{fields.value}}"
            fields:
              - { name: label, label: Intitulé (ex. Plateformes), widget: string }
              - { name: value, label: Valeur (ex. PC), widget: string }
          - { name: about, label: Présentation du jeu (court, accrocheur), widget: text, i18n: true }
          - name: features
            label: Points forts
            label_singular: point fort
            widget: list
            i18n: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titre, widget: string }
              - { name: text, label: Description, widget: text }
          - name: showcase
            label: "Grandes images de la partie « Le jeu » (1re = grande image, 6 conseillées, identiques dans toutes les langues)"
            label_singular: image
            widget: list
            required: false
            i18n: duplicate
            fields:
              - { name: image, label: Image (format paysage), widget: image }
              - { name: caption, label: Légende (facultative), widget: string, required: false }
          - name: details
            label: "Visuels de la partie « Le jeu en détail » (affiches 4:5, une série par langue)"
            label_singular: visuel
            widget: list
            required: false
            i18n: true
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: Image, widget: image }
              - { name: caption, label: "Description courte (lue par les lecteurs d'écran)", widget: string, required: false }
          - name: videos
            label: "Vidéos YouTube (la première est le trailer mis en avant)"
            label_singular: vidéo
            widget: list
            required: false
            i18n: duplicate
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titre, widget: string }
              - { name: youtube, label: Lien ou identifiant YouTube, widget: string }
          - name: gallery
            label: "Captures d'écran (identiques dans toutes les langues)"
            label_singular: capture
            widget: list
            required: false
            i18n: duplicate
            fields:
              - { name: image, label: Image, widget: image }
              - { name: caption, label: Légende (courte, neutre), widget: string, required: false }
          - name: news
            label: Actus
            label_singular: actu
            widget: list
            i18n: true
            required: false
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { name: title, label: Titre, widget: string }
              - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { name: body, label: Texte (une ligne vide = nouveau paragraphe), widget: text }
              - { name: url, label: "Lien « Lire la suite » (facultatif, ex. page itch.io)", widget: string, required: false }
              - { name: num, label: "Numéro du devlog (facultatif, remplace la date à l'affichage)", widget: number, value_type: int, min: 1, required: false }
              - { name: image, label: Image (facultatif), widget: image, required: false }
          - { name: cta_title, label: "Titre du grand bandeau rouge (bas de page)", widget: string, i18n: true }
          - { name: cta_text, label: "Texte du bandeau rouge", widget: text, i18n: true }
          - name: links
            label: "Liens (réseaux, boutique…) dans le bandeau rouge"
            label_singular: lien
            widget: list
            required: false
            i18n: true
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Texte du lien, widget: string }
              - { name: url, label: Adresse (https://…), widget: string }
      - name: guide
        label: "Guide du jeu (notice et astuces)"
        file: content/guide.json
        format: json
        i18n: true
        fields:
          - name: manual
            label: Notice
            label_singular: rubrique
            widget: list
            i18n: true
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titre de la rubrique, widget: string }
              - { name: image, label: Image (facultatif), widget: image, required: false }
              - { name: body, label: "Texte (ligne vide = nouveau paragraphe, « - » = liste, « ## » = sous-titre)", widget: text }
          - name: tips
            label: Trucs et astuces
            label_singular: astuce
            widget: list
            i18n: true
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titre, widget: string }
              - { name: body, label: Texte, widget: text }
